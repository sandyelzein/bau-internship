services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: bau_internship
      POSTGRES_USER: bau_dev
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - bau_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bau_dev -d bau_internship"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bau_postgres_data: